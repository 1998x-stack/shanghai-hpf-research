name: Research data validation
on:
  push:
    branches: [main]
  pull_request:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research package
        run: python -m pip install -e ".[dev,analysis]"
      - name: Reconcile source figures
        run: python -m hpf_research.audit
      - name: Parse annual report business sections and archived district tables
        run: python -m hpf_research.source_validation --check all
      - name: Rebuild derivative CSVs and calculation log
        run: |
          python analysis/scripts/build_outputs.py
          git diff --exit-code -- data/processed outputs/calculation_log.json
      - name: Run tests
        run: python -m pytest -q
      - name: Validate workbook formulas, inputs and parameter provenance
        run: python -m pytest -q tests/test_artifacts.py
      - name: Publish validated reproducible artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shanghai-hpf-validated-research
          path: |
            outputs/shanghai_hpf_research.xlsx
            outputs/calculation_log.json
            outputs/figures/*.png
            data/processed/*.csv
            config/analysis_scenarios.json
          if-no-files-found: error
          retention-days: 30
